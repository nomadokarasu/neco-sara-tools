# GURURI_DEV_DEPLOY_READY
# GURURI_RELEASE_DEPLOY_READY
# COLLECTION_DEV_DEPLOY_READY
# COLLECTION_RELEASE_DEPLOY_READY

name: Deploy to Lolipop

on:
  push:
    branches:
      - main
      - gururi-paint-dev-deploy
      - gururi-paint-release-deploy
      - gururi-paint-admin-deploy
      - gururi-collection-dev-deploy
      - gururi-collection-release-deploy
      - gururi-editor-dev-deploy
      - gururi-editor-release-deploy

permissions:
  contents: read

concurrency:
  group: lolipop-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build website
        run: npm run build

      - name: Prepare Gururi Paint development files
        if: github.ref == 'refs/heads/gururi-paint-dev-deploy'
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const source =
          "dist/tools/gururi-paint-dev";

          const destination =
          ".gururi-deploy/tools/gururi-paint-dev";

          if (!fs.existsSync(source + "/index.html")) {
          throw new Error("開発版のindex.htmlが見つかりません。");
          }

          fs.mkdirSync(
          ".gururi-deploy/tools",
          { recursive: true }
          );

          fs.cpSync(
          source,
          destination,
          { recursive: true }
          );
          NODE

      - name: Upload Gururi Paint development by FTPS
        if: github.ref == 'refs/heads/gururi-paint-dev-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.gururi-deploy/
          server-dir: /tools/
          state-name: .ftp-deploy-gururi-dev-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.admin-credentials.php
            **/.htpasswd
            **/.htaccess
            **/.env*
            tools/gururi-paint-dev/home-content.json
            tools/gururi-paint-dev/home-content-editor.json
            tools/gururi-paint-dev/home-thumbnails/**
            tools/gururi-paint-dev/home-thumbnails-editor/**

      - name: Prepare Gururi Paint release files
        if: github.ref == 'refs/heads/gururi-paint-release-deploy'
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const source =
          "dist/tools/gururi-paint";

          const destination =
          ".gururi-release-deploy/tools/gururi-paint";

          if (!fs.existsSync(source + "/index.html")) {
          throw new Error("公開版のindex.htmlが見つかりません。");
          }

          fs.mkdirSync(
          ".gururi-release-deploy/tools",
          { recursive: true }
          );

          fs.cpSync(
          source,
          destination,
          { recursive: true }
          );
          NODE

      - name: Upload Gururi Paint release by FTPS
        if: github.ref == 'refs/heads/gururi-paint-release-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.gururi-release-deploy/
          server-dir: /tools/
          state-name: .ftp-deploy-gururi-release-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.admin-credentials.php
            **/.htpasswd
            **/.htaccess
            **/.env*
            tools/gururi-paint/home-content.json
            tools/gururi-paint/home-content-editor.json
            tools/gururi-paint/home-thumbnails/**
            tools/gururi-paint/home-thumbnails-editor/**

      - name: Setup PHP for Gururi admin
        if: github.ref == 'refs/heads/gururi-paint-admin-deploy'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none
          coverage: none

      - name: Prepare Gururi Paint admin release file
        if: github.ref == 'refs/heads/gururi-paint-admin-deploy'
        run: |
          mkdir -p .gururi-admin-deploy/tools/gururi-paint
          php -l dist/tools/gururi-paint/admin.php
          cp dist/tools/gururi-paint/admin.php .gururi-admin-deploy/tools/gururi-paint/admin.php

      - name: Upload Gururi Paint admin by FTPS
        if: github.ref == 'refs/heads/gururi-paint-admin-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.gururi-admin-deploy/
          server-dir: /tools/
          state-name: .ftp-deploy-gururi-admin-state.json
          dangerous-clean-slate: false
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.admin-credentials.php
            **/.htpasswd
            **/.htaccess
            **/.env*

      - name: Prepare Gururi Collection development files
        if: github.ref == 'refs/heads/gururi-collection-dev-deploy'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const source = "dist/tools/gururi-collection-dev";
          const destination = ".collection-deploy/gururi-collection-dev";

          const requiredFiles = [
          "index.html",
          "app.js",
          "styles.css",
          "sw.js",
          "manifest.webmanifest",
          "icon-192.png",
          "icon-512.png"
          ];

          for (const fileName of requiredFiles) {
          if (!fs.existsSync(path.join(source, fileName))) {
          throw new Error("必要なファイルが見つかりません：" + fileName);
          }
          }

          fs.mkdirSync(destination, {recursive: true});
          fs.cpSync(source, destination, {recursive: true});
          NODE

      - name: Upload Gururi Collection development by FTPS
        if: github.ref == 'refs/heads/gururi-collection-dev-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.collection-deploy/
          server-dir: /tools/tools/
          state-name: .ftp-deploy-collection-dev-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/.htaccess
            **/.htpasswd

      - name: Prepare Gururi Collection release files
        if: github.ref == 'refs/heads/gururi-collection-release-deploy'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const source = "dist/tools/gururi-collection";
          const destination = ".collection-release-deploy/tools/gururi-collection";

          const requiredFiles = [
          "index.html",
          "app.js",
          "styles.css",
          "sw.js",
          "manifest.webmanifest",
          "icon-192.png",
          "icon-512.png"
          ];

          for (const name of requiredFiles) {
          if (!fs.existsSync(path.join(source, name))) {
          throw new Error("公開版のファイルが見つかりません：" + name);
          }
          }

          fs.mkdirSync(destination, {recursive: true});
          fs.cpSync(source, destination, {recursive: true});
          NODE

      - name: Upload Gururi Collection release by FTPS
        if: github.ref == 'refs/heads/gururi-collection-release-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.collection-release-deploy/
          server-dir: /tools/
          state-name: .ftp-deploy-collection-release-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/.htaccess
            **/.htpasswd

      - name: Prepare Gururi Editor development files
        if: github.ref == 'refs/heads/gururi-editor-dev-deploy'
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const source = "dist/tools/gururi-editor-dev";
          const destination = ".editor-dev-deploy/tools/gururi-editor-dev";

          for (const file of ["index.html", "app.js", "style.css"]) {
            if (!fs.existsSync(source + "/" + file)) {
              throw new Error("ぐるりエディタ開発版のファイルがありません：" + file);
            }
          }

          fs.mkdirSync(destination, {recursive: true});
          fs.cpSync(source, destination, {recursive: true});
          NODE

      - name: Upload Gururi Editor development by FTPS
        if: github.ref == 'refs/heads/gururi-editor-dev-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.editor-dev-deploy/
          server-dir: /tools/
          state-name: .ftp-deploy-editor-dev-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.admin-credentials.php
            **/.htaccess
            **/.htpasswd
            **/.env*
            tools/gururi-editor-dev/home-content.json
            tools/gururi-editor-dev/home-thumbnails/**

      - name: Prepare Gururi Editor release files
        if: github.ref == 'refs/heads/gururi-editor-release-deploy'
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const source = "dist/tools/gururi-editor";
          const destination = ".editor-release-deploy/tools/gururi-editor";

          for (const file of ["index.html", "app.js", "style.css"]) {
            if (!fs.existsSync(source + "/" + file)) {
              throw new Error("ぐるりエディタ公開版のファイルがありません：" + file);
            }
          }

          fs.mkdirSync(destination, {recursive: true});
          fs.cpSync(source, destination, {recursive: true});
          NODE

      - name: Upload Gururi Editor release by FTPS
        if: github.ref == 'refs/heads/gururi-editor-release-deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.editor-release-deploy/
          server-dir: /tools/
          state-name: .ftp-deploy-editor-release-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.admin-credentials.php
            **/.htaccess
            **/.htpasswd
            **/.env*
            tools/gururi-editor/home-content.json
            tools/gururi-editor/home-thumbnails/**

      - name: Upload other tools by FTPS
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /tools/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.admin-credentials.php
            **/.htpasswd
            **/.env*
            tools/gururi-watch/data/**
            tools/gururi-watch/uploads/**
            tools/gururi-watch/api/admin-config.php
            tools/gururi-paint/**
            tools/gururi-paint-dev/**
            tools/gururi-collection-dev/**
            tools/gururi-collection/**
            tools/gururi-editor-dev/**
            tools/gururi-editor/**