name: Deploy to Lolipop

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lolipop-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build website
        run: npm run build

      - name: Upload dist by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /tools/
          exclude: |
            tools/gururi-watch/data/**
            tools/gururi-watch/uploads/**
            tools/gururi-watch/api/admin-config.php