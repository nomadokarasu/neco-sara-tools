const editorTranslationOriginalText=new WeakMap();
const editorTranslationOriginalAttributes=new WeakMap();
let editorTranslationScheduled=false;

function translateEditorText(node,language){
const element=node.parentElement;
if(!element)return;
if(element.closest('#editorHomePage,script,style,textarea,.game-viewport,.game-dialogue,.game-text-overlay,.game-ui-button,.editor-home__items'))return;
if(element.closest('[contenteditable="true"]'))return;

const nodeBody=element.closest('.node-body');
if(nodeBody){
const nodeElement=nodeBody.closest('.node');
const sourceNode=nodeElement&&typeof getNode==='function'?getNode(nodeElement.dataset.id):null;
if(sourceNode?.customBody!==undefined||sourceNode?.type==='uiButton')return;
}

const current=node.nodeValue;
if(!current||!current.trim())return;
const original=editorTranslationOriginalText.get(node);
if(original!==undefined&&current!==original&&current!==editorTranslations[original]){
editorTranslationOriginalText.delete(node);
}
const japanese=editorTranslationOriginalText.get(node)??current;
const key=japanese.trim();
const english=editorTranslations[key];
if(!english)return;
editorTranslationOriginalText.set(node,japanese);
const leading=japanese.match(/^\s*/)?.[0]||'';
const trailing=japanese.match(/\s*$/)?.[0]||'';
const result=language==='en'?leading+english+trailing:japanese;
if(current!==result)node.nodeValue=result;
}

function translateEditorAttributes(element,language){
if(element.closest('#editorHomePage,.game-viewport'))return;
const attributes=['title','placeholder','aria-label'];
let originals=editorTranslationOriginalAttributes.get(element);
if(!originals){
originals={};
editorTranslationOriginalAttributes.set(element,originals);
}
for(const attribute of attributes){
const value=element.getAttribute(attribute);
if(value===null)continue;
if(originals[attribute]!==undefined&&value!==originals[attribute]&&value!==editorTranslations[originals[attribute]]){
delete originals[attribute];
}
const japanese=originals[attribute]??value;
const english=editorTranslations[japanese];
if(!english)continue;
originals[attribute]=japanese;
const result=language==='en'?english:japanese;
if(value!==result)element.setAttribute(attribute,result);
}
}

function translateEditorTree(root){
const language=window.editorLanguage==='en'?'en':'ja';
const container=document.getElementById('app');
if(!container)return;
if(root.nodeType===3){
translateEditorText(root,language);
return;
}
if(root.nodeType!==1)return;
if(root!==container&&!container.contains(root))return;
if(root.matches('script,style'))return;
translateEditorAttributes(root,language);
const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
let current;
while((current=walker.nextNode())){
if(current.nodeType===3)translateEditorText(current,language);
else translateEditorAttributes(current,language);
}
}

const editorTranslationPendingRoots=new Set();

function refreshEditorTranslation(){
translateEditorTree(document.getElementById('app'));
}

function scheduleEditorTranslation(root){
if(root instanceof Node){
editorTranslationPendingRoots.add(root);
}else{
editorTranslationPendingRoots.add(document.getElementById('app'));
}
if(editorTranslationScheduled)return;
editorTranslationScheduled=true;
queueMicrotask(()=>{
editorTranslationScheduled=false;
const roots=[...editorTranslationPendingRoots];
editorTranslationPendingRoots.clear();
for(const root of roots)translateEditorTree(root);
});
}

window.addEventListener('gururi-language-change',()=>{
editorTranslationPendingRoots.clear();
scheduleEditorTranslation(document.getElementById('app'));
});

const editorTranslationObserver=new MutationObserver(mutations=>{
for(const mutation of mutations){
if(mutation.type==='characterData'){
scheduleEditorTranslation(mutation.target);
}else if(mutation.type==='attributes'){
scheduleEditorTranslation(mutation.target);
}else{
for(const node of mutation.addedNodes){
scheduleEditorTranslation(node);
}
}
}
});

editorTranslationObserver.observe(document.getElementById('app'),{
subtree:true,
childList:true,
characterData:true,
attributes:true,
attributeFilter:['title','placeholder','aria-label']
});

scheduleEditorTranslation(document.getElementById('app'));

(()=>{
const home=document.getElementById('editorHomePage');
const start=document.getElementById('editorHomeStart');
const reopen=document.getElementById('editorHomeOpen');
const langButtons=[...document.querySelectorAll('[data-editor-home-lang]')];

ja:{title:'ぐるりエディタ',description:'ぐるりペイントで描いた素材を組み合わせて、インタラクティブ作品を制作できます。',start:'はじめる',important:'重要なお知らせ',notice:'お知らせ',products:'製品情報',links:'関連ページ',noticeEmpty:'お知らせはまだありません。',productTitle:'ぐるりエディタ',productDesc:'360度の画像・動画を組み合わせて、体験型の作品を制作するツールです。',linkSite:'JUNOTAのウェブサイト',linkX:'ぐるりペイント公式X'},
en:{title:'Gururi Editor',description:'Combine 360° worlds to create interactive experiences.',start:'Start',important:'Important notices',notice:'News',products:'Product information',links:'Related pages',noticeEmpty:'No announcements yet.',productTitle:'Gururi Editor',productDesc:'A tool for creating interactive works with 360° images and videos.',linkSite:'JUNOTA website',linkX:'Gururi Paint on X'}
};

if(!response.ok)throw new Error('HTTP '+response.status);
homeContent=await response.json();

function renderCards(target,items){
 target.replaceChildren();
 const type=target.id==='editorHomeNoticeList'?'notice':target.id==='editorHomeLinks'?'link':'simple';
 for(const item of items){
  const card=document.createElement(item.url?'a':'div');
  card.className='editor-home__item editor-home__item--'+type+(item.url?'':' is-disabled');
  if(item.url){card.href=item.url;card.target=item.newTab?'_blank':'_self';if(item.newTab)card.rel='noopener noreferrer';}
  if(type==='link'){
   if(item.thumbnail){
    const thumb=document.createElement('span');thumb.className='editor-home__link-thumbnail';
    const img=document.createElement('img');img.src=item.thumbnail;img.alt='';img.loading='lazy';
    img.addEventListener('error',()=>thumb.remove());thumb.append(img);card.append(thumb);
   }
   const text=document.createElement('span');text.className='editor-home__link-text';
   const title=document.createElement('span');title.className='editor-home__link-title';title.textContent=item.title;
   text.append(title);
   const desc=document.createElement('span');desc.className='editor-home__link-description';desc.textContent=item.description||'';text.append(desc);
   card.append(text);
  }else if(type==='notice'){
   card.textContent=item.title;
  }else{
   const title=document.createElement('span');title.className='editor-home__simple-title';title.textContent=item.title;card.append(title);
   if(item.description){const desc=document.createElement('span');desc.className='editor-home__simple-description';desc.textContent=item.description;card.append(desc);}
  }
  target.append(card);
 }
}
function setLanguage(lang){
const t=data[lang]||data.ja;
const content=homeContent;
const texts=content?.languages?.[lang]||{};
document.documentElement.lang=lang;
window.editorLanguage=lang;
window.dispatchEvent(new CustomEvent('gururi-language-change',{detail:{language:lang}}));
document.getElementById('editorHomeTitle').setAttribute('aria-label',texts.title||t.title);
document.getElementById('editorHomeDescription').textContent=texts.description||t.description;

start.textContent=texts.startButton||t.start;
document.getElementById('editorHomeImportantHeading').textContent=texts.importantHeading||t.important;
document.getElementById('editorHomeNoticeHeading').textContent=texts.noticeHeading||t.notice;
document.getElementById('editorHomeProductsHeading').textContent=texts.productsHeading||t.products;
document.getElementById('editorHomeLinksHeading').textContent=texts.linksHeading||t.links;
document.querySelector('.editor-home__footer').textContent=texts.footer||'© JUNOTA';
langButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.editorHomeLang===lang)));
const managedNotices=Array.isArray(content?.notices)
?content.notices.filter(item=>item.visible!==false).map(item=>{
const localized=item[lang]||item.ja||{};
return {
title:localized.text||'',
url:localized.url||''
};
}).filter(item=>item.title.trim())
:[];
renderCards(document.getElementById('editorHomeNoticeList'),managedNotices.length?managedNotices:[{title:t.noticeEmpty}]);
const managedImportant=Array.isArray(content?.importantNotices)
?content.importantNotices.filter(item=>item.visible!==false).map(item=>{
const localized=item[lang]||item.ja||{};
return {
title:localized.text||'',
url:localized.url||''
};
}).filter(item=>item.title.trim())
:[];
renderCards(document.getElementById('editorHomeImportantList'),managedImportant);
document.getElementById('editorHomeImportantSection').hidden=managedImportant.length===0;
const managedProducts=Array.isArray(content?.products)
?content.products.filter(item=>item.visible!==false).map(item=>{
const localized=item[lang]||item.ja||{};
return {
title:localized.title||'',
description:localized.description||'',
url:localized.url||''
};
}).filter(item=>item.title.trim())
:[];

renderCards(
document.getElementById('editorHomeProducts'),
managedProducts.length?managedProducts:[{title:t.productTitle,description:t.productDesc}]
);
const managedLinks=Array.isArray(content?.relatedPages)
?content.relatedPages.filter(item=>item.visible!==false).map(item=>{
const localized=item[lang]||item.ja||{};
return {
title:localized.title||localized.text||'',
description:localized.description||'',
url:localized.url||item.url||'',
thumbnail:item.thumbnail||''
};
}).filter(item=>item.title.trim())
:[];

renderCards(
document.getElementById('editorHomeLinks'),
managedLinks.length?managedLinks:[
{title:t.linkSite,url:'https://neco-sara.com/'},
{title:t.linkX,url:'https://x.com/gururi_paint'}
]
);
}
start.addEventListener('click',()=>{home.classList.remove('is-open');home.setAttribute('aria-hidden','true');});
reopen.addEventListener('click',()=>{home.classList.add('is-open');home.removeAttribute('aria-hidden');});
langButtons.forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.editorHomeLang)));
setLanguage('ja');
loadHomeContent().then(()=>setLanguage(document.documentElement.lang==='en'?'en':'ja'));
})();
</script>
