<script>
(()=>{
const menus=[document.getElementById('editorFileMenu'),document.getElementById('editorHelpMenu')].filter(Boolean);
for(const menu of menus){
menu.addEventListener('toggle',()=>{
if(!menu.open)return;
for(const other of menus){
if(other!==menu)other.open=false;
}
});
menu.querySelectorAll('.editor-header-dropdown button').forEach(button=>{
button.addEventListener('click',()=>{menu.open=false;});
});
}
document.addEventListener('pointerdown',event=>{
for(const menu of menus){
if(menu.open&&!menu.contains(event.target))menu.open=false;
}
});
})();

const editorTranslationOriginalText=new WeakMap();

function editorTranslateValue(value){
const source=String(value);
if(editorTranslations[source]!==undefined)return editorTranslations[source];

let match;

match=source.match(/^(\d+(?:\.\d+)?) 秒$/);
if(match)return `${match[1]} sec`;

match=source.match(/^(\d+) ページ$/);
if(match)return `${match[1]} pages`;

match=source.match(/^(\d+) テキスト$/);
if(match)return `${match[1]} text items`;

match=source.match(/^(\d+)枚目$/);
if(match)return `Frame ${match[1]}`;

match=source.match(/^選択肢(\d+)$/);
if(match)return `Choice ${match[1]}`;

match=source.match(/^テキスト(\d+)$/);
if(match)return `Text ${match[1]}`;

match=source.match(/^接続先：(\d+)個$/);
if(match)return `Connections: ${match[1]}`;

match=source.match(/^各接続先の選択確率：約([\d.]+)%$/);
if(match)return `Probability per connection: approx. ${match[1]}%`;

match=source.match(/^フェードアウト ([\d.]+) 秒 → リスタート$/);
if(match)return `Fade Out ${match[1]} sec → Restart`;

match=source.match(/^([\d.]+) \/ ([\d.]+) 秒$/);
if(match)return `${match[1]} / ${match[2]} sec`;

match=source.match(/^([\d.]+) \/ ([\d.]+) 秒$/);
if(match)return `${match[1]} / ${match[2]} sec`;

match=source.match(/^◆ ([\d.]+) 秒$/);
if(match)return `◆ ${match[1]} sec`;

match=source.match(/^「(.+)」が(ON|OFF)の間に表示$/);
if(match)return `Show while "${match[1]}" is ${match[2]}`;

match=source.match(/^「(.+)」の(取得|使用|終了)(前|後)に表示$/);
if(match){
const action={取得:'acquisition',使用:'use',終了:'completion'}[match[2]];
return `Show ${match[3]==='前'?'before':'after'} ${action} of "${match[1]}"`;
}

match=source.match(/^素材を読み込んでいます…（(\d+) \/ (\d+)）$/);
if(match)return `Loading Media... (${match[1]} / ${match[2]})`;

match=source.match(/^(.+) の読み込みに失敗しました。\n([\s\S]*)$/);
if(match){
const detail=editorTranslateValue(match[2])??match[2];
return `Failed to load ${match[1]}.\n${detail}`;
}

match=source.match(/^(.+) の元ファイルがありません。再度読み込んでください。$/);
if(match)return `The original file for ${match[1]} is missing. Please import it again.`;

match=source.match(/^(.+) の元ファイルがありません。$/);
if(match)return `The original file for ${match[1]} is missing.`;

match=source.match(/^(.+) の連番PNGがありません。$/);
if(match)return `The PNG sequence for ${match[1]} is missing.`;

match=source.match(/^(.+) のチェックサムが一致しません。$/);
if(match)return `Checksum mismatch for ${match[1]}.`;

match=source.match(/^(.+) を読み込めませんでした。$/);
if(match)return `Could not load ${match[1]}.`;

match=source.match(/^(.+) を読み込めません$/);
if(match)return `Could not load ${match[1]}`;

match=source.match(/^(.+) が見つかりません。$/);
if(match)return `${match[1]} was not found.`;

match=source.match(/^([\s\S]+)を削除しますか？$/);
if(match)return `Delete ${match[1]}?`;

match=source.match(/^([\s\S]+)の読み込みに失敗しました。$/);
if(match)return `Failed to load ${match[1]}.`;

match=source.match(/^([\s\S]+)の読み込みに失敗しました。?\n([\s\S]*)$/);
if(match)return `Failed to load ${match[1]}.\n${match[2]}`;

match=source.match(/^(\d+)枚の連番PNG（(.+)）$/);
if(match)return `PNG Sequence: ${match[1]} Frames (${match[2]})`;

match=source.match(/^トグル (.+)$/);
if(match)return `Toggle ${match[1]}`;

match=source.match(/^ワールド(\d+)$/);
if(match)return `World ${match[1]}`;

match=source.match(/^ダイアローグ\s*(\d+)$/);
if(match)return `Dialogue ${match[1]}`;

match=source.match(/^([▼▶])\s*テキスト(\d+)$/);
if(match)return `${match[1]} Text ${match[2]}`;

match=source.match(/^パネルの高さ（(PC|スマホ)・画面高さの[％%]）$/);
if(match)return `Panel Height (${match[1]==='スマホ'?'Mobile':'PC'}, % of Screen)`;

match=source.match(/^配置（(PC|スマホ)）$/);
if(match)return `Position (${match[1]==='スマホ'?'Mobile':'PC'})`;

match=source.match(/^クリック分岐：(.+)$/);
if(match)return `Click Branch: ${match[1]}`;

match=source.match(/^(.+)：このノードの右端から遷移先につないでください。$/);
if(match)return `${match[1]}: Connect the next node from the output port on the right.`;

match=source.match(/^(.+)：(.+)$/);
if(match&&['取得済み','イベント実行済み','対象未設定'].includes(match[1])){
return `${editorTranslateValue(match[1])??match[1]}: ${match[2]}`;
}

match=source.match(/^(.+?)を削除$/);
if(match)return `Delete ${match[1]}`;

match=source.match(/^([\d.]+)\s*秒$/);
if(match)return `${match[1]} sec`;

match=source.match(/^([\d.]+)\s*\/\s*([\d.]+)\s*秒$/);
if(match)return `${match[1]} / ${match[2]} sec`;

match=source.match(/^取得状況別メディア（(\d+)通り）$/);
if(match)return `Media by Acquisition State (${match[1]} combinations)`;

match=source.match(/^各状態に同じ形式（(.+)）の素材を指定します。未設定時は通常の素材を使用します。$/);
if(match)return `Assign ${match[1]} media for each state. Default media is used when no override is assigned.`;

match=source.match(/^(.+?)・使用中\s*(\d+)\s*ノード$/);
if(match)return `${match[1]} · Used by ${match[2]} nodes`;

match=source.match(/^([\d.]+)\s*\/\s*([\d.]+)\s*秒$/);
if(match)return `${match[1]} / ${match[2]} sec`;

match=source.match(/^ZIPには2:1のPNG画像だけを入れてください。\n対象外のファイル:\s*(.+)$/);
if(match)return `The ZIP must contain only 2:1 PNG images.\nUnsupported file: ${match[1]}`;

match=source.match(/^フレームを変更できませんでした。\n([\s\S]*)$/);
if(match)return `Could not change the frame.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^この画像は追加できません。\n([\s\S]*)$/);
if(match)return `Could not add this image.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^このZIPはアップロードできません。\n([\s\S]*)$/);
if(match)return `Could not import the ZIP file.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^連番PNGを登録できませんでした。\n([\s\S]*)$/);
if(match)return `Could not add the PNG sequence.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^プロジェクトを保存できませんでした。\n([\s\S]*)$/);
if(match)return `Could not save the project.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^プロジェクトを開けませんでした。現在の編集内容は維持されています。\n([\s\S]*)$/);
if(match)return `Could not open the project. Your current changes have been preserved.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^作品を書き出せませんでした。\s*([\s\S]*)$/);
if(match)return `Could not export the work.\n${editorTranslateValue(match[1])??match[1]}`;

match=source.match(/^素材「(.+)」を削除しますか？\n使用中のワールド・レイヤー・ノードの素材指定も解除されます。$/);
if(match)return `Delete media "${match[1]}"?\nReferences in worlds, layers, and nodes will also be cleared.`;

match=source.match(/^(.+)を削除しますか？\nこのワールド内のノード・接続・透明PNGレイヤーも削除されます。([\s\S]*)$/);
if(match)return `Delete ${match[1]}?\nIts nodes, connections, and transparent PNG layers will also be deleted.${match[2]}`;

return null;
}

const editorNativeAlert=window.alert.bind(window);
const editorNativeConfirm=window.confirm.bind(window);
const editorNativePrompt=window.prompt.bind(window);

window.alert=function(message){
const source=String(message);
const translated=window.editorLanguage==='en'?editorTranslateValue(source):null;
return editorNativeAlert(translated??source);
};

window.confirm=function(message){
const source=String(message);
const translated=window.editorLanguage==='en'?editorTranslateValue(source):null;
return editorNativeConfirm(translated??source);
};

window.prompt=function(message,defaultValue){
const source=String(message);
const translated=window.editorLanguage==='en'?editorTranslateValue(source):null;
return editorNativePrompt(translated??source,defaultValue);
};

function translateEditorText(node,language){
const element=node.parentElement;
if(!element)return;
if(element.closest('#editorHomePage,script,style,textarea,.game-viewport,.game-dialogue,.game-text-overlay,.game-ui-button,.editor-home__items'))return;
if(element.closest('[contenteditable="true"]'))return;

const nodeBody=element.closest('.node-body');
if(nodeBody){
const nodeElement=nodeBody.closest('.node');
const sourceNode=nodeElement&&typeof getNode==='function'?getNode(nodeElement.dataset.id):null;
if(sourceNode?.customBody!==undefined||sourceNode?.type==='uiButton')return;
}

const current=node.nodeValue;
if(!current||!current.trim())return;
const original=editorTranslationOriginalText.get(node);
if(original!==undefined&&current!==original&&current!==editorTranslateValue(original.trim())){
editorTranslationOriginalText.delete(node);
}
const japanese=editorTranslationOriginalText.get(node)??current;
const key=japanese.trim();
const english=editorTranslateValue(key);
if(!english)return;
editorTranslationOriginalText.set(node,japanese);
const leading=japanese.match(/^\s*/)?.[0]||'';
const trailing=japanese.match(/\s*$/)?.[0]||'';
const result=language==='en'?leading+english+trailing:japanese;
if(current!==result)node.nodeValue=result;
}

function translateEditorAttributes(element,language){
if(element.closest('#editorHomePage,.game-viewport'))return;
const attributes=['title','placeholder','aria-label'];
let originals=editorTranslationOriginalAttributes.get(element);
if(!originals){
originals={};
editorTranslationOriginalAttributes.set(element,originals);
}
for(const attribute of attributes){
const value=element.getAttribute(attribute);
if(value===null)continue;
if(originals[attribute]!==undefined&&value!==originals[attribute]&&value!==editorTranslateValue(originals[attribute])){
delete originals[attribute];
}
const japanese=originals[attribute]??value;
const english=editorTranslateValue(japanese);
if(!english)continue;
originals[attribute]=japanese;
const result=language==='en'?english:japanese;
if(value!==result)element.setAttribute(attribute,result);
}
}

function translateEditorTree(root){
const language=window.editorLanguage==='en'?'en':'ja';
const container=document.getElementById('app');
if(!container)return;
if(root.nodeType===3){
translateEditorText(root,language);
return;
}
if(root.nodeType!==1)return;
if(root!==container&&!container.contains(root))return;
if(root.matches('script,style'))return;
translateEditorAttributes(root,language);
const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
let current;
while((current=walker.nextNode())){
if(current.nodeType===3)translateEditorText(current,language);
else translateEditorAttributes(current,language);
}
}

const editorTranslationPendingRoots=new Set();

function refreshEditorTranslation(){
translateEditorTree(document.getElementById('app'));
}

function scheduleEditorTranslation(root){
if(root instanceof Node){
editorTranslationPendingRoots.add(root);
}else{
editorTranslationPendingRoots.add(document.getElementById('app'));
}
if(editorTranslationScheduled)return;
editorTranslationScheduled=true;
queueMicrotask(()=>{
editorTranslationScheduled=false;
const roots=[...editorTranslationPendingRoots];
editorTranslationPendingRoots.clear();
for(const root of roots)translateEditorTree(root);
});
}

window.addEventListener('gururi-language-change',()=>{
editorTranslationPendingRoots.clear();
scheduleEditorTranslation(document.getElementById('app'));
});

const editorTranslationObserver=new MutationObserver(mutations=>{
for(const mutation of mutations){
if(mutation.type==='characterData'){
scheduleEditorTranslation(mutation.target);
}else if(mutation.type==='attributes'){
scheduleEditorTranslation(mutation.target);
}else{
for(const node of mutation.addedNodes){
scheduleEditorTranslation(node);
}
}
}
});

editorTranslationObserver.observe(document.getElementById('app'),{
subtree:true,
childList:true,
characterData:true,
attributes:true,
attributeFilter:['title','placeholder','aria-label']
});

scheduleEditorTranslation(document.getElementById('app'));

function renderCards(target,items){
 target.replaceChildren();

    const img=document.createElement('img');img.src=item.thumbnail;img.alt='';img.loading='lazy';

 }
