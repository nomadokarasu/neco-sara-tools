<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="robots"
content="noindex, nofollow"
>

<title>ぐるりペイント</title>

<link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="toolbar">

<div class="toolbar__brand">

<div class="toolbar__title">
ぐるりペイント
</div>

<span
id="appVersion"
class="toolbar__version"
></span>

</div>


<div class="history-controls">

<button
id="undoButton"
class="tool-button"
type="button"
title="元に戻す（Ctrl + Z）"
aria-label="元に戻す"
>
↶
</button>

<button
id="redoButton"
class="tool-button"
type="button"
title="やり直す（Ctrl + Y）"
aria-label="やり直す"
>
↷
</button>

</div>


<div class="toolbar__tools">


<div class="app-menu app-menu--file">

<button
class="app-menu__trigger"
type="button"
data-app-menu="file"
>
ファイル
</button>

<div class="app-menu__panel">

<button
id="projectSaveButton"
class="tool-button app-menu__item"
type="button"
>
データ保存(.gururi)
</button>

<button
id="projectLoadButton"
class="tool-button app-menu__item"
type="button"
>
インポート(.gururi)
</button>

<input
id="projectLoadInput"
type="file"
accept=".gururi,application/json"
hidden
>

<button
id="downloadButton"
class="tool-button app-menu__item"
type="button"
>
PNG保存(2：1画像)
</button>

</div>

</div>


<div class="app-menu app-menu--edit">

<button
class="app-menu__trigger"
type="button"
data-app-menu="edit"
>
編集
</button>

<div class="app-menu__panel">

<button
id="desktopUndoMenuButton"
class="tool-button app-menu__item"
type="button"
>
元に戻す
</button>

<button
id="desktopRedoMenuButton"
class="tool-button app-menu__item"
type="button"
>
やり直す
</button>

</div>

</div>


<button
id="previewButton"
class="toolbar-menu-button"
type="button"
>
プレビュー
</button>


<div class="app-menu app-menu--settings">

<button
class="app-menu__trigger"
type="button"
data-app-menu="settings"
>
設定
</button>

<div class="app-menu__panel">

<button
id="shortcutSettingsButton"
class="tool-button app-menu__item"
type="button"
>
ショートカット
</button>

</div>

</div>


<div class="app-menu app-menu--help">

<button
class="app-menu__trigger"
type="button"
data-app-menu="help"
>
ヘルプ
</button>

<div class="app-menu__panel">

<button
id="desktopHelpMenuButton"
class="tool-button app-menu__item"
type="button"
>
はじめに
</button>

</div>

</div>


<div class="eye-height-control">

<label for="eyeHeight">
目線
</label>

<button
id="eyeHeightMinus"
class="eye-height-step-button"
type="button"
title="目線を下げる"
>
−
</button>

<input
id="eyeHeight"
type="range"
min="0.5"
max="30"
step="0.1"
value="1.5"
>

<button
id="eyeHeightPlus"
class="eye-height-step-button"
type="button"
title="目線を上げる"
>
＋
</button>

<input
id="eyeHeightValue"
class="number-input"
type="number"
min="0.5"
max="30"
step="0.1"
value="1.5"
>

<span>
m
</span>

</div>


<label class="guide-toggle">

<input
id="groundToggle"
type="checkbox"
checked
>

<span>
補助グリッド
</span>

</label>


</div>


<button
id="languageButton"
class="tool-button"
type="button"
title="英語に切り替え"
aria-label="英語に切り替え"
>
EN
</button>


<button
id="helpButton"
class="tool-button toolbar__mobile-help"
type="button"
title="はじめに"
>
はじめに
</button>

</header>

<main id="viewport"></main>


<aside class="drawing-tools">

<div class="drawing-tool-buttons">

<button
id="penTool"
class="tool-button drawing-tool-button is-active"
type="button"
title="ペン"
aria-label="ペン"
>

<svg
class="drawing-tool-icon"
viewBox="0 0 24 24"
aria-hidden="true"
>
<path
d="M4 20l4.2-1 10.7-10.7a2.1 2.1 0 0 0 0-3l-.2-.2a2.1 2.1 0 0 0-3 0L5 15.8 4 20z"
></path>
<path
d="M14.5 6.3l3.2 3.2"
></path>
</svg>

<span class="drawing-tool-label">
ペン
</span>

</button>


<button
id="eraserTool"
class="tool-button drawing-tool-button"
type="button"
title="消しゴム"
aria-label="消しゴム"
>

<svg
class="drawing-tool-icon"
viewBox="0 0 24 24"
aria-hidden="true"
>
<path
d="M7.2 18.5l-3-3a2 2 0 0 1 0-2.8l7.8-7.8a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8l-5.8 5.8H7.2z"
></path>
<path
d="M9 9l6 6"
></path>
<path
d="M7.2 18.5H20"
></path>
</svg>

<span class="drawing-tool-label">
消しゴム
</span>

</button>


<button
id="bucketTool"
class="tool-button drawing-tool-button"
type="button"
title="バケツ"
aria-label="バケツ"
>

<svg
class="drawing-tool-icon"
viewBox="0 0 24 24"
aria-hidden="true"
>
<path
d="M5.5 11.5l7-7 7 7-7 7-7-7z"
></path>
<path
d="M9.5 7.5l7 7"
></path>
<path
d="M18 17c0 1.4-1.1 2.5-2.5 2.5S13 18.4 13 17c0-.9 1-2.2 2.5-4 1.5 1.8 2.5 3.1 2.5 4z"
></path>
</svg>

<span class="drawing-tool-label">
バケツ
</span>

</button>


<button
id="eyedropperTool"
class="tool-button drawing-tool-button"
type="button"
title="スポイト"
aria-label="スポイト"
>

<svg
class="drawing-tool-icon"
viewBox="0 0 24 24"
aria-hidden="true"
>
<path
d="M13.5 5.5l5 5"
></path>
<path
d="M15.5 3.5a2.1 2.1 0 0 1 3 0l2 2a2.1 2.1 0 0 1 0 3L10 19H5v-5L15.5 3.5z"
></path>
<path
d="M5 19l-1 1"
></path>
</svg>

<span class="drawing-tool-label">
スポイト
</span>

</button>


<button
id="lookTool"
class="tool-button drawing-tool-button"
type="button"
title="手のひら"
aria-label="手のひら"
>

<svg
class="drawing-tool-icon"
viewBox="0 0 24 24"
aria-hidden="true"
>
<path
d="M8 11V7.5a1.5 1.5 0 0 1 3 0V11"
></path>
<path
d="M11 10V6.5a1.5 1.5 0 0 1 3 0V11"
></path>
<path
d="M14 10V7.5a1.5 1.5 0 0 1 3 0V12"
></path>
<path
d="M8 10V9a1.5 1.5 0 0 0-3 0v5c0 4 2.8 7 7 7h1c4.4 0 7-2.8 7-7v-2.5a1.5 1.5 0 0 0-3 0V13"
></path>
</svg>

<span class="drawing-tool-label">
手のひら
</span>

</button>


<button
id="addToolButton"
class="tool-button drawing-tool-button drawing-tool-button--add"
type="button"
title="ツールを追加"
aria-label="ツールを追加"
>

<svg
class="drawing-tool-icon"
viewBox="0 0 24 24"
aria-hidden="true"
>
<path
d="M12 5v14"
></path>
<path
d="M5 12h14"
></path>
</svg>

<span class="drawing-tool-label">
追加
</span>

</button>

</div>


<div class="drawing-tools__separator"></div>


<div class="pen-size-control">

<div class="pen-size-label">
太さ
</div>

<div class="pen-size-slider">

<button
id="penSizeMinus"
class="size-step-button"
type="button"
title="細くする"
>
−
</button>

<input
id="penSize"
type="range"
min="1"
max="50"
value="3"
aria-label="ペンの太さ"
>

<button
id="penSizePlus"
class="size-step-button"
type="button"
title="太くする"
>
＋
</button>

</div>

<input
id="penSizeValue"
class="number-input"
type="number"
min="1"
max="50"
step="1"
value="3"
inputmode="numeric"
enterkeyhint="done"
aria-label="ペンの太さを数値入力"
>


<!--
スマートフォン用
現在色ボタン
-->

<button
id="mobileColorButton"
class="mobile-color-swatch"
type="button"
aria-label="色を選択"
aria-expanded="false"
></button>

</div>


<div class="pen-color-control">

<span class="pen-color-label">
色
</span>


<!--
PC用
現在のペン色
-->

<div
id="currentPenColorSwatch"
class="current-pen-color-swatch"
aria-label="現在のペン色"
></div>


<div id="colorPickerWheel">

<!--
外周：
色相リング
-->

<div id="colorWheelLayer">

<div
id="colorHueHandle"
aria-hidden="true"
></div>

</div>


<!--
色相リングの中央を
完全に操作不可にする領域
-->

<div
id="colorWheelHole"
aria-hidden="true"
></div>


<!--
中央：
彩度・明度
-->

<div id="colorBoxLayer"></div>

</div>

<input
id="penColorInput"
type="color"
value="#000000"
hidden
>

</div>

<div
id="recentColors"
class="recent-colors"
aria-label="最近使用した色"
></div>


<!--
スマートフォン用
カラーホイール背景
-->

<div
id="mobileColorBackdrop"
class="mobile-color-backdrop"
aria-hidden="true"
></div>


</aside>


<!-- =============================
レイヤー
============================== -->

<aside class="layer-panel">

<div class="layer-panel__header">

<strong>
レイヤー
</strong>

<button
id="addLayerButton"
class="layer-action-button"
type="button"
title="レイヤーを追加"
>
＋
</button>

</div>

<div
id="layerList"
class="layer-list"
></div>

<div class="layer-panel__actions">

<button
id="layerUpButton"
class="layer-action-button"
type="button"
title="上へ移動"
>
↑
</button>

<button
id="layerDownButton"
class="layer-action-button"
type="button"
title="下へ移動"
>
↓
</button>

<button
id="deleteLayerButton"
class="layer-action-button layer-action-button--delete"
type="button"
title="レイヤーを削除"
>
削除
</button>

</div>

</aside>


<!-- =============================
スマートフォン用 下部タブ
============================== -->

<nav
class="mobile-bottom-tabs"
aria-label="操作パネル"
>

<button
class="mobile-bottom-tab is-active"
type="button"
data-mobile-panel="draw"
>
描画
</button>

<button
class="mobile-bottom-tab"
type="button"
data-mobile-panel="layer"
>
レイヤー
</button>

<button
class="mobile-bottom-tab"
type="button"
data-mobile-panel="settings"
>
設定
</button>

</nav>


<!-- =============================
はじめに
============================== -->

<div
id="helpPanel"
class="welcome-overlay"
role="dialog"
aria-modal="true"
aria-labelledby="welcomePanelTitle"
>

<div class="welcome-panel">

<div class="welcome-panel__header">

<strong id="welcomePanelTitle">
はじめに
</strong>

<div class="welcome-panel__header-actions">

<div
class="welcome-language-switch"
aria-label="Language"
>

<button
class="welcome-language-button"
type="button"
data-welcome-language="ja"
aria-pressed="true"
>
日本語
</button>

<button
class="welcome-language-button"
type="button"
data-welcome-language="en"
aria-pressed="false"
>
English
</button>

</div>

<button
id="helpCloseButton"
class="welcome-close-button"
type="button"
aria-label="閉じる"
>
×
</button>

</div>

</div>


<div class="welcome-panel__content">

<img
id="welcomeImage"
class="welcome-image"
src="./images/welcome-ja.png"
alt="ぐるりペイントの基本操作と案内"
draggable="false"
>


<div class="welcome-links">

<a
id="welcomeXLink"
class="welcome-link-button"
href="https://x.com/_datsumori_"
target="_blank"
rel="noopener noreferrer"
>
Xをフォロー
</a>

<a
id="welcomeNoteLink"
class="welcome-link-button welcome-link-button--secondary"
href="https://note.com/junnoota"
target="_blank"
rel="noopener noreferrer"
>
開発について読む・応援する
</a>

</div>

</div>

</div>

</div>


<!-- =============================
ツールを追加
============================== -->

<div
id="toolLibraryPanel"
class="welcome-overlay tool-library-overlay"
role="dialog"
aria-modal="true"
aria-labelledby="toolLibraryPanelTitle"
>

<div class="welcome-panel tool-library-panel">

<div class="welcome-panel__header">

<strong id="toolLibraryPanelTitle">
ツールを追加
</strong>

<button
id="toolLibraryCloseButton"
class="welcome-close-button"
type="button"
aria-label="閉じる"
>
×
</button>

</div>


<div class="welcome-panel__content">

<div class="tool-library-item">

<div class="tool-library-item__text">

<strong id="cameraToolTitle">
カメラ
</strong>

<p id="cameraToolDescription">
現在見えている360°空間を通常の画像として撮影します。
</p>

</div>

<button
id="cameraToolAddButton"
class="tool-button tool-library-add-button"
type="button"
>
追加
</button>

</div>

</div>

</div>

</div>


<!-- =============================
ショートカット設定
============================== -->

<div
id="shortcutPanel"
class="welcome-overlay shortcut-overlay"
role="dialog"
aria-modal="true"
aria-labelledby="shortcutPanelTitle"
>

<div class="welcome-panel shortcut-panel">

<div class="welcome-panel__header">

<strong id="shortcutPanelTitle">
ショートカット設定
</strong>

<button
id="shortcutCloseButton"
class="welcome-close-button"
type="button"
aria-label="閉じる"
>
×
</button>

</div>


<div class="welcome-panel__content">

<p
id="shortcutInstruction"
class="shortcut-instruction"
>
変更したい項目を押してから、新しいキーを押してください。
</p>


<div class="shortcut-list">

<div class="shortcut-row">
<span data-shortcut-label="pen">
ペン
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="pen"
></button>
</div>

<div class="shortcut-row">
<span data-shortcut-label="eraser">
消しゴム
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="eraser"
></button>
</div>

<div class="shortcut-row">
<span data-shortcut-label="bucket">
バケツ
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="bucket"
></button>
</div>

<div class="shortcut-row">
<span data-shortcut-label="eyedropper">
スポイト
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="eyedropper"
></button>
</div>

<div class="shortcut-row">
<span data-shortcut-label="look">
手のひら
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="look"
></button>
</div>

<div class="shortcut-row">
<span data-shortcut-label="lookAround">
見回し
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="lookAround"
></button>
</div>

<div class="shortcut-row">
<span data-shortcut-label="zoom">
ズーム
</span>
<button
class="shortcut-key-button"
type="button"
data-shortcut-action="zoom"
></button>
</div>

</div>


<div class="look-direction-setting">

<label for="lookDirectionHorizontalSelect">
カメラ操作（水平）
</label>

<select
id="lookDirectionHorizontalSelect"
>
<option value="standard">
標準
</option>

<option value="reverse">
反転
</option>
</select>

</div>


<div class="look-direction-setting">

<label for="lookDirectionVerticalSelect">
カメラ操作（垂直）
</label>

<select
id="lookDirectionVerticalSelect"
>
<option value="standard">
標準
</option>

<option value="reverse">
反転
</option>
</select>

</div>


<div
id="shortcutStatus"
class="shortcut-status"
aria-live="polite"
></div>


<div class="shortcut-actions">

<button
id="shortcutResetButton"
class="tool-button shortcut-reset-button"
type="button"
>
初期設定に戻す
</button>

<button
id="shortcutConfirmButton"
class="tool-button shortcut-confirm-button"
type="button"
>
保存
</button>

</div>

</div>

</div>

</div>


<!-- =============================
設定保存の確認
============================== -->

<div
id="shortcutSaveConfirmPanel"
class="welcome-overlay shortcut-save-confirm-overlay"
role="dialog"
aria-modal="true"
aria-labelledby="shortcutSaveConfirmMessage"
>

<div class="shortcut-save-confirm-panel">

<p id="shortcutSaveConfirmMessage">
設定を保存しますか？
</p>

<div class="shortcut-save-confirm-actions">

<button
id="shortcutSaveConfirmYesButton"
class="tool-button"
type="button"
>
する
</button>

<button
id="shortcutSaveConfirmNoButton"
class="tool-button"
type="button"
>
しない
</button>

</div>

</div>

</div>


<!-- =============================
360°長方形プレビュー
============================== -->

<div
id="previewOverlay"
class="preview-overlay"
>

<div class="preview-panel">

<div class="preview-header">

<div class="preview-header__main">

<div class="canvas-size-control">

<label for="canvasSize">
出力サイズ
</label>

<select id="canvasSize">

<option value="2048">
2048 × 1024
</option>

<option
value="4096"
selected
>
4096 × 2048
</option>

<option value="8192">
8192 × 4096
</option>

</select>

</div>


<button
id="previewDownloadButton"
class="tool-button"
type="button"
>
ダウンロード
</button>

</div>


<button
id="previewCloseButton"
class="tool-button"
type="button"
>
閉じる
</button>

</div>

<div class="preview-canvas-area">

<div class="preview-canvas-wrap">

<!--
360°画像の
左端位置を決めるハンドル
-->

<button
id="previewSeamHandle"
class="preview-seam-handle"
type="button"
title="ドラッグして画像の左端を変更"
aria-label="ドラッグして画像の左端を変更"
>
▼
</button>


<canvas
id="previewCanvas"
></canvas>

</div>

</div>

</div>

</div>

<script
type="module"
src="./script.js"
></script>

</body>
</html>
