<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コード統合ツール</title>

  <meta
    name="description"
    content="フォルダ内のコードをひとつのテキストファイルにまとめるWebツールです。AIとのコード共有にお使いください。"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="app-header">
    <div class="app-header__inner">

      <div>
        <a href="../../../" class="back-link">← ツール一覧</a>
        <h1>コード統合ツール</h1>
      </div>

      <span class="version">v1.0.0</span>

    </div>
  </header>


  <main class="app-main">

    <section class="intro">
      <p>
  プロジェクトフォルダを選択すると、
  統合したいファイルやフォルダを選び、「統合する」を押してください。
  AIとのコード共有にお使いください。
</p>

      <p class="privacy-note">
        ファイルはブラウザ内で処理され、サーバーには送信されません。
      </p>
    </section>


    <section class="controls">

      <label class="select-button">
        フォルダを選択

        <input
          id="folder-input"
          type="file"
          webkitdirectory
          multiple
        >
      </label>

      <button
        id="download-button"
        class="download-button"
        type="button"
        disabled
      >
        テキストを保存
      </button>
      <button id="copy-button" class="download-button" type="button" disabled>テキストをコピー</button>

    </section>


    <section
  id="summary"
  class="summary"
  hidden
>
  <div>
    <span class="summary__label">FILES</span>
    <strong id="file-count">0</strong>
  </div>

  <div>
    <span class="summary__label">EXCLUDED</span>
    <strong id="excluded-count">0</strong>
  </div>

  <div>
    <span class="summary__label">SIZE</span>
    <strong id="total-size">0 KB</strong>
  </div>
</section>


    <section
      id="file-section"
      class="file-section"
      hidden
    >

<div class="section-heading">
<div class="section-heading-left">
<h2>ファイル・フォルダを選択</h2>
<label class="select-all-label">
<input id="select-all-checkbox" type="checkbox">
<span>すべて選択</span>
</label>
</div>
<button
id="clear-button"
class="text-button"
type="button"
>
クリア
</button>
</div>

      <div
        id="file-list"
        class="file-list"
      ></div>
<div class="selection-actions">
<span id="selection-count"></span>
<div class="selection-action-buttons">
<button id="combine-button" class="select-button" type="button" disabled>統合する</button>
<button id="copy-button-bottom" class="download-button" type="button" disabled>テキストをコピー</button>
</div>
</div>

    </section>


    <section
  id="excluded-section"
  class="excluded-section"
  hidden
>
  <div class="section-heading">
    <h2>除外されたファイル</h2>
  </div>

  <div
    id="excluded-list"
    class="excluded-list"
  ></div>
</section>

    <section
      id="preview-section"
      class="preview-section"
      hidden
    >

      <div class="section-heading">
        <h2>出力プレビュー</h2>


      </div>

      <textarea
        id="output"
        readonly
        spellcheck="false"
      ></textarea>

    </section>

  </main>


  <script src="./app.js"></script>

</body>
</html>
